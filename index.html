<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>España · Musical introductions</title><style>*{box-sizing:border-box}body{margin:0;background:#fff6e3;color:#292323;font:16px system-ui}main{max-width:620px;margin:auto;padding:14px}header{background:#aa151b;color:#ffda44;padding:20px;border-radius:16px;border-bottom:7px solid #ffda44}h1{margin:0}.player{position:sticky;top:0;background:#fff6e3;padding:8px 0;z-index:2}iframe{width:100%;height:220px;border:0;border-radius:12px}article{display:flex;align-items:center;gap:10px;background:white;border-radius:12px;margin:9px 0;padding:12px}article.active{outline:2px solid #aa151b}small{display:block;color:#625b54}button{border:0;border-radius:9px;padding:12px;background:#aa151b;color:white;font-weight:bold;cursor:pointer}.info{flex:1}a{color:#8b151a}</style><main><header><h1>🇪🇸 ESPAÑA</h1><p>Musical introductions · 20 segundos por canción</p></header><section class="player"><div id="video"></div><p id="status">Selecciona una canción.</p><button id="stop">■ STOP</button></section><div id="tracks"></div><small>Requiere internet. YouTube puede mostrar anuncios o restringir algunos vídeos.</small></main><script>const songs=[['Welcome and introduction','Y viva España · Manolo Escobar','ubuIDiVVIYs'],['Flamenco','Entre dos aguas · Paco de Lucía','2oyhlad64-s'],['Spanish balcony','Granada · Rafael Aguirre','Pu3Ha2uIdP0'],['Architecture','Asturias · Jessica Kaiser','OxClUGpwXGs'],['World Champions','Canción seleccionada','uuAI1DRopZQ'],['Seville and catering','Sevilla tiene un color especial · Los del Río','sdKrjU-yCQM'],['Museo del Prado','Concierto de Aranjuez – Adagio · Miloš Karadaglić','je3cqn8XsT0'],['Farewell','Bamboléo · Gipsy Kings','w-isTDv6hq0']];const video=document.getElementById('video'),status=document.getElementById('status');function stop(){video.replaceChildren();document.querySelectorAll('article').forEach(a=>a.classList.remove('active'));status.textContent='Reproducción detenida.'}document.getElementById('stop').onclick=stop;songs.forEach((s,i)=>{const start=i===0?1:20,end=start+20,range='00:'+String(start).padStart(2,'0')+'–00:'+String(end).padStart(2,'0');const a=document.createElement('article');a.innerHTML='<strong>'+String(i+1).padStart(2,'0')+'</strong><div class="info"><b>'+s[0]+'</b><small>'+s[1]+' · '+range+'</small><small><a href="https://www.youtube.com/watch?v='+s[2]+'&t='+start+'s" target="_blank" rel="noopener">Enlace alternativo</a></small></div><button>▶ PLAY</button>';a.querySelector('button').onclick=()=>{stop();a.classList.add('active');const f=document.createElement('iframe');f.title=s[1];f.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';f.src='https://www.youtube.com/embed/'+s[2]+'?autoplay=1&start='+start+'&end='+end+'&playsinline=1&rel=0';video.append(f);status.textContent=s[1]+' · '+range+'. Si no inicia, toca ▶ dentro del vídeo.'};document.getElementById('tracks').append(a)});</script></html>
